<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizacje</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/3.0.9/leaflet-search.min.css" />

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body id="glowna-strona" style="display: none;">

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/3.0.9/leaflet-search.min.js"></script>

    <script>
        // Inicjalizacja mapy
        const map = L.map('map').setView([51.9194, 19.1451], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Grupa dla Twoich pinezek
        const markersLayer = new L.LayerGroup();
        markersLayer.addTo(map);

        // --- PINEZKI Z KODU ---
        const marker1 = L.marker([51.5510, 21.8923], {title: "Dęblin"});
        marker1.bindPopup("<b>Dęblin</b><br> 41 BLSz.");
        markersLayer.addLayer(marker1);
        // ---------------------

        // Wyszukiwarka 
        const searchControl = new L.Control.Search({
            layer: markersLayer,
            initial: false,
            zoom: 12,
            marker: false,
            textPlaceholder: "Szukaj w swoich punktach..."
        });

        map.addControl(searchControl);
    </script>

</body>

<!-- SKRYPT SPRAWDZAJĄCY HASŁO NA SAMYM KOŃCU -->
<script>
    const tajneHaslo = "mojamapa123";  
    let podaneHaslo = prompt("Podaj hasło, aby zobaczyć mapę:");

    if (podaneHaslo === tajneHaslo) {
        // Jeśli hasło OK, odkrywamy całą stronę
        document.getElementById("glowna-strona").style.display = "block";
    } else {
        // Jeśli złe, wyświetlamy tylko komunikat i nic więcej
        document.body.style.display = "block";
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:30vh; color:red; font-family: sans-serif;'>Błędne hasło! Brak dostępu do mapy.</h2>";
    }
</script>
</html>
